name: Windows install smoke test

# Separate from ci.yml on purpose: the GPU (sglang/vllm) and Mac (mlx)
# backends have no Windows wheels at all -- that's an upstream limitation
# in those projects, not something this repo can fix. This job only
# verifies what Windows *can* actually do today: install the core package
# and import it without crashing, which is exactly what broke before the
# uvloop fix (see fix/windows-uvloop) -- pip install itself failed, and
# importing parallax.p2p.utils failed even if you worked around that by
# hand.
#
# Deliberately doesn't run tests/scheduler_tests/: tests/conftest.py
# unconditionally imports parallax.utils.utils -> mlx.core for every test
# under tests/, and mlx's own Windows wheel fails to load its native DLL
# on this runner ("DLL load failed while importing core"). That's a
# separate, pre-existing issue in the mlx package itself, unrelated to
# the uvloop fix this workflow exists to verify.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-smoke-test.yml'
      - 'src/parallax/p2p/**'
      - 'src/backend/main.py'
      - 'src/parallax/server/node_chat_http_server.py'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  windows-import-smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Exercise the uvloop fallback fix in parallax.p2p.utils
        run: |
          python -c "import parallax.p2p.utils as u; assert u._HAS_UVLOOP is False, 'expected no uvloop on Windows'; loop = u.switch_to_uvloop(); print('OK', type(loop).__module__, type(loop).__name__); loop.close()"

      - name: Sanity check the CLI entry point imports
        run: |
          python -c "import parallax.cli; print('OK parallax.cli imports')"
